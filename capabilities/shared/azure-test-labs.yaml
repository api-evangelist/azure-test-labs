naftiko: "1.0.0-alpha1"

info:
  label: "Azure DevTest Labs"
  description: "Azure DevTest Labs REST API for Azure resource management."
  tags:
    - Azure
    - Cloud
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AZURE_SUBSCRIPTION_ID: AZURE_SUBSCRIPTION_ID
      AZURE_ACCESS_TOKEN: AZURE_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: azure-test-labs
      baseUri: https://management.azure.com
      description: "Azure DevTest Labs REST API"
      authentication:
        type: bearer
        token: "{{AZURE_ACCESS_TOKEN}}"
      resources:
        - name: lab
          path: /subscriptions/{subscriptionId}/providers/Microsoft.Lab/Labs
          description: "Manage Lab resources"
          operations:
            - name: list-labs
              method: GET
              description: "List all Lab resources"
              inputParameters:
                - name: subscriptionId
                  in: path
                  type: string
                  required: true
                  description: "Azure subscription ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: virtual-machine
          path: /subscriptions/{subscriptionId}/providers/Microsoft.VirtualMachine/VirtualMachines
          description: "Manage VirtualMachine resources"
          operations:
            - name: list-virtual-machines
              method: GET
              description: "List all VirtualMachine resources"
              inputParameters:
                - name: subscriptionId
                  in: path
                  type: string
                  required: true
                  description: "Azure subscription ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: environment
          path: /subscriptions/{subscriptionId}/providers/Microsoft.Environment/Environments
          description: "Manage Environment resources"
          operations:
            - name: list-environments
              method: GET
              description: "List all Environment resources"
              inputParameters:
                - name: subscriptionId
                  in: path
                  type: string
                  required: true
                  description: "Azure subscription ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: formula
          path: /subscriptions/{subscriptionId}/providers/Microsoft.Formula/Formulas
          description: "Manage Formula resources"
          operations:
            - name: list-formulas
              method: GET
              description: "List all Formula resources"
              inputParameters:
                - name: subscriptionId
                  in: path
                  type: string
                  required: true
                  description: "Azure subscription ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: custom-image
          path: /subscriptions/{subscriptionId}/providers/Microsoft.CustomImage/CustomImages
          description: "Manage CustomImage resources"
          operations:
            - name: list-custom-images
              method: GET
              description: "List all CustomImage resources"
              inputParameters:
                - name: subscriptionId
                  in: path
                  type: string
                  required: true
                  description: "Azure subscription ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8188
      namespace: azure-test-labs-api
      resources:
        - path: /v1/resources
          name: resources
          description: "Resource management"
          operations:
            - method: GET
              name: list-resources
              description: "List resources"
              call: "azure-test-labs.list-labs"
              with:
                subscriptionId: "rest.subscriptionId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9188
      namespace: azure-test-labs-mcp
      transport: http
      tools:
        - name: list-labs
          description: "List Lab resources in Azure"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-test-labs.list-labs"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-virtual-machines
          description: "List VirtualMachine resources in Azure"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-test-labs.list-virtual-machines"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-environments
          description: "List Environment resources in Azure"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-test-labs.list-environments"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-formulas
          description: "List Formula resources in Azure"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-test-labs.list-formulas"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-custom-images
          description: "List CustomImage resources in Azure"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-test-labs.list-custom-images"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
