        example: example-value
        schema:
          type: string
      - description: 'Specify the $expand query. Example: ''properties($select=displayName)'''
        in: query
        name: $expand
        example: example-value
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSource'
        default:
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      tags:
      - ArtifactSources
      summary: Azure DevTest Labs Artifact Sources_ Get
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    patch:
      description: Allows modifying tags of artifact sources. All other properties will be ignored.
      operationId: ArtifactSources_Update
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      - $ref: '#/components/parameters/resourceGroupName'
      - description: The name of the lab.
        in: path
        name: labName
        required: true
        example: example-value
        schema:
          type: string
      - description: The name of the artifact source.
        in: path
        name: name
        required: true
        example: example-value
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSource'
        default:
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      tags:
      - ArtifactSources
      summary: Azure DevTest Labs Artifact Sources_ Update
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactSourceFragment'
        description: Properties of an artifact source.
        required: true
    put:
      description: Create or replace an existing artifact source.
      operationId: ArtifactSources_CreateOrUpdate
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      - $ref: '#/components/parameters/resourceGroupName'
      - description: The name of the lab.
        in: path
        name: labName
        required: true
        example: example-value
        schema:
          type: string
      - description: The name of the artifact source.
        in: path
        name: name
        required: true
        example: example-value
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSource'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSource'
        default:
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      tags:
      - ArtifactSources
      summary: Azure DevTest Labs Artifact Sources_ Create or Update
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactSource'
        description: Properties of an artifact source.
        required: true
components:
  schemas:
    ArtifactSourcePropertiesFragment:
      description: Properties of an artifact source.
      properties:
        armTemplateFolderPath:
          description: The folder containing Azure Resource Manager templates.
          type: string
        branchRef:
          description: The artifact source's branch reference.
          type: string
        displayName:
          description: The artifact source's display name.
          type: string
        folderPath:
          description: The folder containing artifacts.
          type: string
        securityToken:
          description: The security token to authenticate to the artifact source.
          type: string
        sourceType:
          description: The artifact source's type.
          enum:
          - VsoGit
          - GitHub
          type: string
          x-ms-enum:
            modelAsString: true
            name: SourceControlType
        status:
          description: 'Indicates if the artifact source is enabled (values: Enabled, Disabled).'
          enum:
          - Enabled
          - Disabled
          type: string
          x-ms-enum:
            modelAsString: true
            name: EnableStatus
        uri:
          description: The artifact source's URI.
          type: string
      type: object
    CloudError:
      description: Error from a REST request.
      properties:
        error:
          $ref: '#/components/schemas/CloudErrorBody'
          description: The cloud error that occurred
      type: object
      x-ms-external: true
    ArtifactSourceList:
      description: The response of a list operation.
      properties:
        nextLink:
          description: Link for next set of results.
          type: string
        value:
          description: Results of the list operation.
          items:
            $ref: '#/components/schemas/ArtifactSource'
          type: array
      type: object
    CloudErrorBody:
      description: Body of an error from a REST request.
      properties:
        code:
          description: The error code.
          type: string
        details:
          description: Inner errors.
          items:
            $ref: '#/components/schemas/CloudErrorBody'
          type: array
        message:
          description: The error message.
          type: string
        target:
          description: The error target.
          type: string
      type: object
      x-ms-external: true
    ArtifactSourceProperties:
      description: Properties of an artifact source.
      properties:
        armTemplateFolderPath:
          description: The folder containing Azure Resource Manager templates.
          type: string
        branchRef:
          description: The artifact source's branch reference.
          type: string
        createdDate:
          description: The artifact source's creation date.
          format: date-time
          readOnly: true
          type: string
        displayName:
          description: The artifact source's display name.
          type: string
        folderPath:
          description: The folder containing artifacts.
          type: string
        provisioningState:
          description: The provisioning status of the resource.
          readOnly: true
          type: string
        securityToken:
          description: The security token to authenticate to the artifact source.
          type: string
        sourceType:
          description: The artifact source's type.
          enum:
          - VsoGit
          - GitHub
          type: string
          x-ms-enum:
            modelAsString: true
            name: SourceControlType
        status:
          description: 'Indicates if the artifact source is enabled (values: Enabled, Disabled).'
          enum:
          - Enabled
          - Disabled
          type: string
          x-ms-enum:
            modelAsString: true
            name: EnableStatus
        uniqueIdentifier:
          description: The unique immutable identifier of a resource (Guid).
          readOnly: true
          type: string
        uri:
          description: The artifact source's URI.
          type: string
      type: object
    UpdateResource:
      description: Represents an update resource
      properties:
        tags:
          additionalProperties:
            type: string
          description: The tags of the resource.
          type: object
      type: object
    Resource:
      description: An Azure resource.
      properties:
        id:
          description: The identifier of the resource.
          readOnly: true
          type: string
        location:
          description: The location of the resource.
          type: string
        name:
          description: The name of the resource.
          readOnly: true
          type: string
        tags:
          additionalProperties:
            type: string
          description: The tags of the resource.
          type: object
        type:
          description: The type of the resource.
          readOnly: true
          type: string
      type: object
      x-ms-azure-resource: true
    ArtifactSourceFragment:
      allOf:
      - $ref: '#/components/schemas/UpdateResource'
      description: Properties of an artifact source.
      properties:
        properties:
          $ref: '#/components/schemas/ArtifactSourcePropertiesFragment'
          description: The properties of the resource.
          x-ms-client-flatten: true
      type: object
    ArtifactSource:
      allOf:
      - $ref: '#/components/schemas/Resource'
      description: Properties of an artifact source.
      properties:
        properties:
          $ref: '#/components/schemas/ArtifactSourceProperties'
          description: The properties of the resource.
          x-ms-client-flatten: true
      required:
      - properties
      type: object
  parameters:
    subscriptionId:
      description: The subscription ID.
      in: path
      name: subscriptionId
      required: true
      schema:
        type: string
    resourceGroupName:
      description: The name of the resource group.
      in: path
      name: resourceGroupName
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    api-version:
      description: Client API version.
      in: query
      name: api-version
      required: true
      schema:
        type: string
        default: '2018-09-15'
  securitySchemes:
