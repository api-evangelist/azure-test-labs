name: Azure DevTest Labs
description: >-
  Azure DevTest Labs enables developers to efficiently self-manage virtual
  machines and PaaS resources without waiting for approvals. DevTest Labs
  creates labs consisting of pre-configured bases or Azure Resource Manager
  templates for development and testing purposes.
